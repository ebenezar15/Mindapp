name: Desktop apps

# Builds Mindapp for Mac (Apple Silicon + Intel), Windows and Linux.
# Runs when the app changes, or from the Actions tab ("Run workflow").
# Download each platform's zip from the run's Artifacts section.
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", "js/**", "css/**", "index.html", "icons/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Install rcodesign (ad-hoc signing for Apple Silicon)
        run: |
          curl -sSL -o rc.tgz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf rc.tgz
          echo "RCODESIGN=$PWD/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign" >> "$GITHUB_ENV"
      - name: Build
        working-directory: desktop
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Mindapp-Mac-AppleSilicon
          path: desktop/dist/Mindapp-Mac-AppleSilicon.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Mindapp-Mac-Intel
          path: desktop/dist/Mindapp-Mac-Intel.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Mindapp-Windows
          path: desktop/dist/Mindapp-Windows.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Mindapp-Linux
          path: desktop/dist/Mindapp-Linux.zip
          compression-level: 0
